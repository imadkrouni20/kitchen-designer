<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no">
<title>مصمم المطبخ</title>
<link rel="stylesheet" href="style.css">
</head>
<body>

<canvas id="c"></canvas>

<!-- زر عائم -->
<div id="fab-wrap">
  <div id="fab-menu" class="fab-menu hidden">
    <button class="fab-item" data-panel="add"><span class="fi-ico">➕</span></button>
    <button class="fab-item" data-panel="colors"><span class="fi-ico">🎨</span></button>
    <button class="fab-item" data-panel="list"><span class="fi-ico">📦</span></button>
    <button class="fab-item" data-panel="room"><span class="fi-ico">🏠</span></button>
    <button class="fab-item" data-panel="cut"><span class="fi-ico">📋</span></button>
    <button class="fab-item" data-panel="io"><span class="fi-ico">💾</span></button>
  </div>
  <button id="fab-shot" class="fab-shot" title="لقطة شاشة">📷</button>
<button id="fab-undo" class="fab-undo" title="تراجع">↶</button>
<button id="fab-main" class="fab-main"><span>☰</span></button>
</div>

<!-- لوحة -->
<aside id="panel" class="panel hidden">
  <header class="panel-head">
    <h2 id="panel-title">لوحة</h2>
    <button id="panel-close" class="close-btn">✕</button>
  </header>
  <div id="panel-body" class="panel-body"></div>
</aside>

<!-- خصائص -->
<aside id="props" class="panel props hidden">
  <header class="panel-head">
    <h2 id="props-title">الخصائص</h2>
    <button id="props-close" class="close-btn">✕</button>
  </header>
  <div id="props-body" class="panel-body"></div>
</aside>

<div id="status" class="status">اسحب للدوران · نقرة = تحديد · نقرتان = خصائص</div>

<script src="three.min.js"></script>
<script src="OrbitControls.js"></script>
<script src="app.js"></script>
<button id="toggle-btn" class="toggle-btn hidden" title="فتح/إغلاق">🔓</button>
<button id="props-btn" class="props-btn hidden" title="خصائص">⚙</button>
</body>
</html>
